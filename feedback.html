<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Cambridge AI Safety Hub</title>
  <meta name="description" content="Give feedback to the Cambridge AI Safety Hub.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Space Mono', monospace;
      background: #fbfbfa;
      color: #1a1a1a;
      line-height: 1.8;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
    }
    main { width: 100%; max-width: 26rem; text-align: center; }
    .label {
      font-size: 0.63rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #625c56;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 2.6rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p { font-size: 0.8rem; color: #4a4a4a; margin-bottom: 2.5rem; }
    .choices { display: grid; gap: 1rem; }
    .choices a {
      display: block;
      padding: 1.1rem 1.5rem;
      border: 1px solid #1a1a1a;
      color: #1a1a1a;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .choices a:hover, .choices a:focus-visible {
      background: #1a1a1a;
      color: #fbfbfa;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Cambridge AI Safety Hub</div>
    <h1>Feedback</h1>
    <p>Choose the form that applies to you.</p>
    <div class="choices">
      <a href="https://airtable.com/app8d6sDud8MgJ4XD/pagn0Ig2LiaOt0D1E/form">Participant</a>
      <a href="https://airtable.com/app8d6sDud8MgJ4XD/pag6gQRL4px2hQGzt/form">Resident</a>
    </div>
  </main>
</body>
</html>
